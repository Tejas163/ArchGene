version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ARCHGENE_API_KEY=${ARCHGENE_API_KEY}
      - OLLAMA_BASE_URL=http://host.docker_internal:11434
    volumes:
      - ./eval_history.json:/app/eval_history.json
    restart: unless-stopped
    
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    
volumes:
  ollama_data: