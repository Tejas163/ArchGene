[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archgene"
version = "0.3.0"
description = "Self-healing multi-agent cognitive architecture evaluation system"
requires-python = ">=3.10"
dependencies = [
    "z3-solver",
    "smolagents",
    "rich",
    "click",
    "fastapi",
    "uvicorn",
    "streamlit",
]

[project.scripts]
archgene = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]