[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archgene"
version = "0.4.1"
description = "Design, verify, and generate LLM architectures before you waste GPU compute"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["llm", "transformer", "architecture", "verification", "z3", "pytorch", "gpu-cost"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "z3-solver",
    "torch",
    "rich",
    "click",
    "requests",
]

[project.optional-dependencies]
web = ["streamlit"]

[project.urls]
Homepage = "https://github.com/Tejas163/ArchGene"
Repository = "https://github.com/Tejas163/ArchGene"
"Bug Tracker" = "https://github.com/Tejas163/ArchGene/issues"

[project.scripts]
archgene = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["archgene*", "cli*"]