[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archgene"
version = "0.4.0"
description = "Verify your LLM architecture before you waste compute — formal verification, cost estimation, and benchmark projections"
requires-python = ">=3.10"
dependencies = [
    "z3-solver",
    "torch",
    "rich",
    "click",
    "requests",
]

[project.optional-dependencies]
web = ["streamlit"]

[project.scripts]
archgene = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]